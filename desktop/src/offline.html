<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>EMV — нет соединения</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font: 15px/1.5 "Segoe UI", Arial, sans-serif; color: #111; background: #fff;
    }
    .box { text-align: center; max-width: 420px; padding: 24px; }
    .logo {
      display: inline-block; border: 5px solid #000; padding: 6px 14px;
      font: 800 28px Arial, sans-serif; letter-spacing: .5px; margin-bottom: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #555; margin: 0 0 20px; }
    .reason { font-size: 12px; color: #999; margin-top: 16px; }
    button {
      font: inherit; padding: 8px 22px; border: 0; border-radius: 6px;
      background: #000; color: #fff; cursor: pointer;
    }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">EMV</div>
    <h1>Нет связи с сервером</h1>
    <p>Проверьте подключение к интернету. Страница откроется снова, как только связь появится.</p>
    <button id="retry">Повторить</button>
    <div class="reason" id="reason"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const retry = /^https?:\/\//.test(q.get("retry") || "") ? q.get("retry") : "https://emv.one/admin";
    document.getElementById("reason").textContent = q.get("reason") || "";
    const go = () => { location.href = retry; };
    document.getElementById("retry").onclick = go;
    window.addEventListener("online", go);
    setInterval(() => { if (navigator.onLine) go(); }, 15000);
  </script>
</body>
</html>
